<style>
/* Layout: three-column studio. Zone rail left, live 3D cabin centre, material decision panel right. Stacks on phones. */
:root{
  --bg:#e8ebed; --surface:#f5f6f7; --surface2:#dde2e5; --line:#cbd2d6;
  --fg:#12181b; --fg2:#4a565c;
  --accent:#1c6b74; --accent-fg:#ffffff; --accent-soft:#1c6b7420;
  --ok:#17693b; --warn:#8f5600; --bad:#b3261e; --pend:#56636b;
  --stage-a:#f4f6f7; --stage-b:#b4bdc3;
  --f-display:'Saira Semi Condensed','Arial Narrow',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1214; --surface:#161c1f; --surface2:#20282c; --line:#2b353b;
    --fg:#e7edf0; --fg2:#9aa8af;
    --accent:#58bcc6; --accent-fg:#06191c; --accent-soft:#58bcc626;
    --ok:#55c283; --warn:#e3a53b; --bad:#f0746b; --pend:#8a99a2;
    --stage-a:#2b363c; --stage-b:#0c1012;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1214; --surface:#161c1f; --surface2:#20282c; --line:#2b353b;
  --fg:#e7edf0; --fg2:#9aa8af;
  --accent:#58bcc6; --accent-fg:#06191c; --accent-soft:#58bcc626;
  --ok:#55c283; --warn:#e3a53b; --bad:#f0746b; --pend:#8a99a2;
  --stage-a:#2b363c; --stage-b:#0c1012;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg); font:14px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p,dl,dd{margin:0}
.app{display:flex;flex-direction:column;gap:12px;min-height:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex-wrap:wrap}
.logo{font:600 22px/1 var(--f-display);letter-spacing:.01em}
.logo b{font-weight:600;color:var(--accent)}
.sep{width:1px;height:18px;background:var(--line)}
.prod{font:500 12px var(--f-mono);color:var(--fg2);letter-spacing:.04em;text-transform:uppercase}
.chip{font:500 11px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;color:var(--fg2);border:1px solid var(--line);border-radius:3px;padding:3px 8px}

.main{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.rail,.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.rail{display:flex;flex-direction:column;gap:18px;padding:14px}
.panel{display:flex;flex-direction:column;gap:14px;padding:14px}
.stage{position:relative;border-radius:6px;overflow:hidden;border:1px solid var(--line);min-width:0;height:min(62vh,520px);min-height:320px;
  background:radial-gradient(120% 90% at 50% 25%,var(--stage-a),var(--stage-b))}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline-offset:-3px}
.stage canvas:active{cursor:grabbing}
.stage-top{position:absolute;top:10px;left:12px;font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);pointer-events:none}
.views{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:2px;padding:3px;border-radius:6px;background:var(--surface);border:1px solid var(--line);max-width:calc(100% - 24px)}
.views button{border:0;background:transparent;padding:6px 12px;border-radius:4px;font-weight:500;font-size:13px;color:var(--fg2);white-space:nowrap}
.views button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.hint{position:absolute;right:12px;top:10px;font:400 11px var(--f-mono);color:var(--fg2);pointer-events:none;display:none}
.loading,.nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font:500 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg2);background:transparent}
.loading[hidden],.nogl[hidden]{display:none}
.credit{font-size:11px;color:var(--fg2)}
.credit a{color:inherit}
.credit[hidden]{display:none}

h3.lbl{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin-bottom:8px}
.signoff .row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.so-num{font:600 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.so-num small{font:400 12px var(--f-body);color:var(--fg2);margin-left:6px}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:10px}
.segs i{height:6px;border-radius:2px;background:var(--c,var(--pend))}
.so-meta{margin-top:8px;font-size:12px;color:var(--fg2)}
.so-meta b{font-family:var(--f-mono);font-weight:500;color:var(--fg)}
.warn{margin-top:6px;font-size:12px;color:var(--bad)}
.s-approved{--c:var(--ok)} .s-shortlisted{--c:var(--warn)} .s-rejected{--c:var(--bad)} .s-pending{--c:var(--pend)}

.zones{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.zone{flex:0 0 auto;min-width:176px;display:flex;align-items:center;gap:10px;text-align:left;padding:8px;border:1px solid var(--line);background:var(--surface);border-radius:5px}
.zone[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.th{width:36px;height:36px;border-radius:4px;flex:0 0 auto;display:block;border:1px solid var(--line)}
.zt{display:flex;flex-direction:column;min-width:0;flex:1}
.zn{font-weight:600;font-size:13px}
.zm{font-size:12px;color:var(--fg2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:0 0 auto}

.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.preset{text-align:left;padding:10px;border:1px solid var(--line);background:var(--surface);border-radius:5px;display:flex;flex-direction:column;gap:3px}
.preset:hover,.zone:hover,.opt:hover{border-color:var(--accent)}
.preset .pt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.preset .pn{font:600 16px var(--f-display);letter-spacing:.01em}
.preset .ps{font:500 11px var(--f-mono);color:var(--fg2)}
.preset .pd{font-size:12px;color:var(--fg2)}
.note{font-size:11px;color:var(--fg2);margin-top:6px}
.paints{display:flex;gap:10px;flex-wrap:wrap}
.paint{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--p);padding:0}
.paint[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.paint-name{font-size:12px;color:var(--fg2);margin-top:10px}
.paint-name b{font-family:var(--f-mono);font-weight:500;color:var(--fg)}

.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ph h2{font:600 24px/1.1 var(--f-display);letter-spacing:.01em}
.mono{font:400 11px var(--f-mono);color:var(--fg2);letter-spacing:.04em}
.cur{display:flex;gap:12px;align-items:center}
.thl{width:64px;height:64px;border-radius:5px;border:1px solid var(--line);flex:0 0 auto}
.cur h3{font:600 17px/1.2 var(--f-display);text-wrap:balance}
.sub{font-size:12px;color:var(--fg2)}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.specs>div{background:var(--surface);padding:8px 10px;min-width:0}
.specs dt{font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg2)}
.specs dd{font:500 14px var(--f-mono);margin-top:2px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.decide{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.decide button{padding:8px 4px;border:1px solid var(--line);background:var(--surface);border-radius:5px;font-weight:500;font-size:13px}
.decide button[aria-pressed="true"]{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:8px;border:1px solid var(--line);background:var(--surface);border-radius:5px;width:100%}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .ot{flex:1;min-width:0;display:flex;flex-direction:column}
.opt .on{font-weight:600;font-size:13px}
.opt .om{font:400 11px var(--f-mono);color:var(--fg2);margin-top:1px}
.pill{font:500 10px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:3px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);white-space:nowrap}

@media (min-width:1000px){
  .app{height:100%}
  .main{display:grid;grid-template-columns:272px minmax(0,1fr) 352px;align-items:stretch}
  .stage{height:auto;min-height:0}
  .rail,.panel{overflow-y:auto;min-height:0}
  .zones{flex-direction:column;overflow:visible}
  .zone{min-width:0}
  .presets{grid-template-columns:1fr}
  .hint{display:block}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="logo">CMF<b>Stack</b></span>
      <span class="sep" aria-hidden="true"></span>
      <span class="prod">Aurora EV · Interior</span>
    </div>
    <span class="chip">Sample data · procedural model</span>
  </header>
  <main class="main">
    <aside class="rail" id="rail" aria-label="Sign-off, zones and combinations"></aside>
    <section class="stage" id="stage" aria-label="3D interior viewer">
      <canvas id="gl" tabindex="0" aria-label="3D car interior. Drag to look around, scroll to zoom, arrow keys rotate."></canvas>
      <div class="stage-top" id="viewLabel">Exterior</div>
      <p class="hint">Drag to look · Scroll to zoom · Click a part to select its zone</p>
      <div class="views" id="views" role="group" aria-label="Camera views">
        <button type="button" data-view="exterior" aria-pressed="true">Exterior</button>
        <button type="button" data-view="overview" aria-pressed="false">Cutaway</button>
        <button type="button" data-view="driver" aria-pressed="false">Driver</button>
        <button type="button" data-view="rear" aria-pressed="false">Rear seat</button>
      </div>
      <div class="loading" id="loading">Building cabin…</div>
      <div class="nogl" id="nogl" hidden>This browser could not start WebGL, so the 3D cabin cannot be shown. Material choices still work.</div>
    </section>
    <aside class="panel" id="panel" aria-label="Material options"></aside>
  </main>
  <p class="credit" id="credit" hidden></p>
</div>

<script>

  {id:'m5',zone:'z2',name:'Leather Panel — Bordeaux',type:'Leather',supplier:'Bridge of Weir',cost:'£52/m²',dur:'High',sus:'B',status:'pending',kind:'leather',color:'#5b1827',tile:.18},
  {id:'m6',zone:'z2',name:'Open Pore Walnut Veneer',type:'Wood veneer',supplier:'Tabu S.p.A',cost:'£65/m²',dur:'Medium',sus:'B',status:'shortlisted',kind:'wood',pore:true,color:'#6d4932',tile:.6},
  {id:'m14',zone:'z2',name:'Woven Textile — Charcoal',type:'Fabric',supplier:'Kvadrat',cost:'£32/m²',dur:'Medium',sus:'A',status:'pending',kind:'fabric',color:'#363a40',tile:.22},

  {id:'m9',zone:'z4',name:'Brushed Aluminium',type:'Metal trim',supplier:'Novelis EU',cost:'£28/unit',dur:'V.High',sus:'A-',status:'approved',kind:'metal',color:'#c6cacd',tile:.45},
  {id:'m10',zone:'z4',name:'Matte Black Finish',type:'Composite',supplier:'SGL Carbon',cost:'£35/unit',dur:'V.High',sus:'B+',status:'shortlisted',kind:'carbon',color:'#17181b',tile:.16},
  {id:'m11',zone:'z4',name:'Burl Wood Accent',type:'Wood veneer',supplier:'Tabu S.p.A',cost:'£72/unit',dur:'Medium',sus:'B',status:'pending',kind:'burl',color:'#7b4a28',tile:.2},

];

  {n:'Premium Dark',s:94,d:'Black leather seats, dark suede headliner, matte black console. Cohesive dark luxury.',sel:{z1:'m1',z2:'m14',z3:'m7',z4:'m10',z5:'m12'}},
  {n:'Warm Contrast',s:89,d:'Cognac seats, walnut door panels, brushed aluminium console. Warm and inviting.',sel:{z1:'m2',z2:'m6',z3:'m8',z4:'m9',z5:'m12'}},
  {n:'Nordic Light',s:86,d:'Cream seats, light grey headliner, brushed aluminium. Clean Scandinavian feel.',sel:{z1:'m3',z2:'m4',z3:'m8',z4:'m9',z5:'m16'}}
];
var LABEL={approved:'Approved',shortlisted:'Shortlisted',rejected:'Rejected',pending:'Pending'};
var GRADE={'A':5,'A-':4.67,'B+':4.33,'B':4,'B-':3.67,'C+':3.33};
var PAINTS=[
  {n:'Glacier White',c:'#e6e9ea'},
  {n:'Midnight Blue',c:'#14233f'},
  {n:'Graphite',c:'#3a4045'},
  {n:'Racing Green',c:'#1f3d31'},
  {n:'Burnt Copper',c:'#8c4a2a'}
];
/* Detailed car model. Set MODEL=null to use only the procedural car. */
var MODEL={url:'models/honda-e.glb',name:'Honda e',title:'FREE // Honda E (Detailed Interior) 2021',author:'Alex Murias (Xlay3D)',src:'https://sketchfab.com/3d-models/free-honda-e-detailed-interior-2021-814cf3f8cfd64594b1c4f96e873c3cef',scale:.01,paint:'CarPaintWhite'};
var state={zone:'z1',view:'exterior',shell:false,paint:1,sel:{z1:'m2',z2:'m4',z3:'m7',z4:'m10',z5:'m12'}};
var matById=function(id){for(var i=0;i<MATS.length;i++)if(MATS[i].id===id)return MATS[i]};
var zoneById=function(id){for(var i=0;i<ZONES.length;i++)if(ZONES[i].id===id)return ZONES[i]};

/* ---------- Procedural textures (colour + bump), tileable, one per material ---------- */
var S=256,TWO=Math.PI*2;
function rng(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seedOf(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mkCanvas(){var c=document.createElement('canvas');c.width=c.height=S;return c}
function rgb(hex){var n=parseInt(hex.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function c8(v){return v<0?0:v>255?255:v}

function dotHeight(r,count,rmin,rmax,alpha){
  var c=mkCanvas(),g=c.getContext('2d');
  g.fillStyle='rgb(90,90,90)';g.fillRect(0,0,S,S);
  g.globalCompositeOperation='lighter';
  for(var i=0;i<count;i++){
    var x=r()*S,y=r()*S,rad=rmin+r()*(rmax-rmin);
    var xs=[x],ys=[y];
    if(x<rad)xs.push(x+S);if(x>S-rad)xs.push(x-S);
    if(y<rad)ys.push(y+S);if(y>S-rad)ys.push(y-S);
    for(var a=0;a<xs.length;a++)for(var b=0;b<ys.length;b++){
      var gr=g.createRadialGradient(xs[a],ys[b],0,xs[a],ys[b],rad);
      gr.addColorStop(0,'rgba(255,255,255,'+alpha+')');gr.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=gr;g.beginPath();g.arc(xs[a],ys[b],rad,0,TWO);g.fill();
    }
  }
  return c;
}

function genTexture(m){
  var r=rng(seedOf(m.id)),base=rgb(m.color);
  var cc=mkCanvas(),cb=mkCanvas(),gc=cc.getContext('2d'),gb=cb.getContext('2d');
  var ic=gc.createImageData(S,S),ib=gb.createImageData(S,S),C=ic.data,B=ib.data;
  function put(i,f,h,add){
    var k=i*4;add=add||0;
    C[k]=c8(base[0]*f+add);C[k+1]=c8(base[1]*f+add);C[k+2]=c8(base[2]*f+add);C[k+3]=255;
    var v=c8(h*255);B[k]=B[k+1]=B[k+2]=v;B[k+3]=255;
  }
  var x,y,i;
  if(m.kind==='leather'){
    var hd=dotHeight(r,m.perf?1400:2400,3,m.perf?4.5:5.5,.32).getContext('2d').getImageData(0,0,S,S).data;
    for(i=0;i<S*S;i++){var h=hd[i*4]/255;put(i,.95+.1*h,h)}
  }else if(m.kind==='fabric'){
    for(y=0;y<S;y++)for(x=0;x<S;x++){
      var over=(((x>>2)+(y>>2))&1)===0;
      var hh=over?.5+.5*Math.sin((((x&3)+.5)/4)*Math.PI):.5+.5*Math.sin((((y&3)+.5)/4)*Math.PI);
      hh=hh*.8+r()*.2;
      put(y*S+x,(.62+.5*hh)*(.95+.1*r()),hh);
    }
  }else if(m.kind==='suede'){
    for(y=0;y<S;y++)for(x=0;x<S;x++){
      var n=r(),bl=Math.sin(x/S*TWO*3+1)*Math.sin(y/S*TWO*4+2);
      put(y*S+x,.82+.3*n+.05*bl,.5+.4*n);
    }
  }else if(m.kind==='wood'){
    var ph0=r()*TWO,ph1=r()*TWO,rowN=new Float32Array(S);
    for(y=0;y<S;y++)rowN[y]=r();
    for(y=0;y<S;y++)for(x=0;x<S;x++){

  var cut=null,bodyMats=[],CLIP=[new THREE.Plane(new THREE.Vector3(1,0,0),1e6),new THREE.Plane(new THREE.Vector3(-1,0,0),1e6),new THREE.Plane(new THREE.Vector3(0,-1,0),1e6),new THREE.Plane(new THREE.Vector3(0,0,-1),1e6)];
  renderer.localClippingEnabled=true;
  var MC={};
  function matFor(m){
    if(MC[m.id])return MC[m.id];
    var t=getTex(m),map=new THREE.CanvasTexture(t.color),bump=new THREE.CanvasTexture(t.bump);
    [map,bump].forEach(function(tx){tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(1/m.tile,1/m.tile);tx.anisotropy=maxAniso});
    map.encoding=THREE.sRGBEncoding;
    /* [roughness, metalness, bumpScale, clearcoat, clearcoatRoughness]. bumpScale is the grain depth in metres (scene units), so real values are tiny. */
    var K={leather:[.5,0,.0003,.25,.4],fabric:[.95,0,.0006,0,0],suede:[1,0,.0002,0,0],wood:[.5,0,.0003,.35,.3],burl:[.45,0,.0002,.5,.2],metal:[.32,1,.0001,0,0],carbon:[.55,.15,.0003,0,0]}[m.kind];
    var p={map:map,bumpMap:bump,bumpScale:K[2],roughness:K[0],metalness:K[1],envMapIntensity:m.kind==='metal'?1.1:.35};
    if(K[3]){p.clearcoat=K[3];p.clearcoatRoughness=K[4]}
    var mat=new THREE.MeshPhysicalMaterial(p);mat.emissive=new THREE.Color(0xffffff);mat.emissiveIntensity=0;mat.clippingPlanes=CLIP;
    return MC[m.id]=mat;
  }
  var dirty=true,pulse=0,pulseZone='z1';
  function applySel(zid){
    var mat=matFor(matById(state.sel[zid]));
    ZM[zid].forEach(function(me){me.material=mat});dirty=true;
  }
  ZONES.forEach(function(z){applySel(z.id)});
  /* Hex colours are sRGB; r128 treats material colours as linear, so convert them once so the 3D matches the swatches */
  var seen=new Set();
  scene.traverse(function(o){[].concat(o.material||[]).forEach(function(m){
    if(seen.has(m))return;seen.add(m);
    if(m.color)m.color.convertSRGBToLinear();if(m.emissive)m.emissive.convertSRGBToLinear();
  })});

  /* Camera */
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function updateCam(){
    var cp=Math.cos(cur.pitch),dx=Math.sin(cur.yaw)*cp,dy=Math.sin(cur.pitch),dz=-Math.cos(cur.yaw)*cp;
    camera.position.set(cur.px-dx*cur.d,cur.py-dy*cur.d,cur.pz-dz*cur.d);
    camera.lookAt(camera.position.x+dx,camera.position.y+dy,camera.position.z+dz);
    camera.fov=cur.fov;camera.updateProjectionMatrix();
    var p=camera.position;
    if(cut){
      /* orbiting far away, or sitting inside the cabin: show everything. Orbiting close outside: open the near side. */
      var far=cur.d>cut.far||(Math.abs(p.x)<cut.x&&p.y<cut.top&&p.z<cut.z&&p.z>cut.front),OFF=1e6;
      CLIP[0].constant=!far&&p.x<-cut.x?cut.x:OFF;CLIP[1].constant=!far&&p.x>cut.x?cut.x:OFF;
      CLIP[2].constant=!far&&p.y>cut.y?cut.y:OFF;CLIP[3].constant=!far&&p.z>cut.z?cut.z:OFF;
      return;
    }
    if(waiting){root.visible=gShell.visible=false;return}
    var sh=gShell.visible=Math.sqrt(p.x*p.x+(p.y-.7)*(p.y-.7)+(p.z-.2)*(p.z-.2))>4.4;
    gL.visible=sh||p.x>-.78;gR.visible=sh||p.x<.78;gTop.visible=sh||p.y<1.3;gRear.visible=sh||p.z<1.5;
  }
  function resize(){
    var r=$('#stage').getBoundingClientRect(),w=Math.max(1,Math.round(r.width)),h=Math.max(1,Math.round(r.height));
    renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();dirty=true;
  }
  if(window.ResizeObserver)new ResizeObserver(resize).observe($('#stage'));else window.addEventListener('resize',resize);
  resize();

  var last=performance.now();
  function tick(now){
    var dt=Math.min(.05,(now-last)/1000);last=now;
    var k=reduce?1:1-Math.exp(-dt*6),moving=false;
    for(var i=0;i<KEYS.length;i++){
      var key=KEYS[i],d=goal[key]-cur[key];
      if(Math.abs(d)>1e-4){cur[key]+=d*k;moving=true}else cur[key]=goal[key];
    }
    if(pulse>0){
      pulse=Math.max(0,pulse-dt*2.2);
      var pm=MC[state.sel[pulseZone]];if(pm)pm.emissiveIntensity=pulse*.2;
      moving=true;
    }
    if(moving||dirty){updateCam();renderer.render(scene,camera);dirty=false}
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  if(waiting)$('#loading').textContent='Loading '+MODEL.name+'…';else $('#loading').hidden=true;

  /* Interaction */
  var ptrs=new Map(),moved=0,lastPinch=0,lastHover=0,ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
  function clampPitch(){goal.pitch=Math.max(-1.3,Math.min(goal.d>.3?.08:1.3,goal.pitch))}
  function drag(dx,dy){
    var k=.0055;
    if(goal.d>.3){goal.yaw+=dx*k;goal.pitch-=dy*k}
    else{var f=goal.fov/75;goal.yaw-=dx*k*f;goal.pitch+=dy*k*f}
    clampPitch();cur.yaw=goal.yaw;cur.pitch=goal.pitch;dirty=true;
    if(state.view){state.view=null;renderViews()}
  }
  function zoom(delta){
    if(goal.d>.3)goal.d=Math.max(1.2,Math.min(11,goal.d*(1+delta*.001)));
    else goal.fov=Math.max(38,Math.min(95,goal.fov+delta*.03));
  }
  function pinchDist(){var a=Array.from(ptrs.values());return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
  function visible(o){while(o){if(!o.visible)return false;o=o.parent}return true}
  function hitZone(e){
    var r=canvas.getBoundingClientRect();
    ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(ndc,camera);
    var hits=ray.intersectObjects(allZone.concat(shellBlock).filter(visible),false).filter(function(h){return CLIP.every(function(pl){return pl.distanceToPoint(h.point)>=0})});
    return hits.length&&hits[0].object.userData.zone?hits[0].object.userData.zone:null;
  }
  canvas.addEventListener('pointerdown',function(e){
    canvas.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1)moved=0;if(ptrs.size===2){lastPinch=pinchDist();moved=99}
  });
  canvas.addEventListener('pointermove',function(e){
    var p=ptrs.get(e.pointerId);
    if(!p){var t=performance.now();if(t-lastHover>120){lastHover=t;canvas.style.cursor=hitZone(e)?'pointer':''}return}
    var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(ptrs.size===1){moved+=Math.abs(dx)+Math.abs(dy);if(moved>4)drag(dx,dy)}
    else if(ptrs.size===2){var dn=pinchDist();zoom((lastPinch-dn)*2.5);lastPinch=dn}
  });
  function up(e){
    if(ptrs.size===1&&moved<=4){var z=hitZone(e);if(z)selectZone(z)}
    ptrs.delete(e.pointerId);
  }
  canvas.addEventListener('pointerup',up);
  canvas.addEventListener('pointercancel',function(e){ptrs.delete(e.pointerId)});
  canvas.addEventListener('wheel',function(e){e.preventDefault();zoom(e.deltaY)},{passive:false});
  canvas.addEventListener('keydown',function(e){
    var m={ArrowLeft:[-14,0],ArrowRight:[14,0],ArrowUp:[0,-14],ArrowDown:[0,14]}[e.key];
    if(m){e.preventDefault();drag(m[0],m[1])}
  });

  gl={
    focus:function(v){setGoal(v)},
    refresh:function(zid){applySel(zid)},
    paint:function(c){paintMat.color.set(c).convertSRGBToLinear();bodyMats.forEach(function(m){m.color.set(c).convertSRGBToLinear()});dirty=true},
    pulse:function(zid){for(var k in MC)MC[k].emissiveIntensity=0;pulseZone=zid;pulse=1;dirty=true}
  };

  /* ---------- Detailed model: models/honda-e.glb replaces the procedural car when it loads.
     Meshes are tagged to zones by node/material name and given world-space box UVs (so each CMF material's `tile` stays in metres).
     Close orbit views cut the near side away with clipping planes (CLIP), set in updateCam(). ---------- */
  function loadModel(){
    if(!THREE.GLTFLoader||!MODEL)return;
    var st=$('#loading');
    $('.prod').textContent=MODEL.name+' · Interior';$('.chip').textContent='Sample data · '+MODEL.name+' model';
    function done(ok){
      waiting=false;st.hidden=true;dirty=true;
      if(!ok){root.visible=true;gShell.visible=true;$('.prod').textContent='Aurora EV · Interior';$('.chip').textContent='Sample data · procedural model'}
    }
    var loader=new THREE.GLTFLoader();
    if(THREE.DRACOLoader){var draco=new THREE.DRACOLoader();draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/draco/');loader.setDRACOLoader(draco)}
    loader.load(MODEL.url,function(gltf){
      try{fitModel(gltf.scene);done(true)}catch(err){console.error('Model setup failed, using procedural car',err);scene.remove(gltf.scene);done(false)}
    },function(x){if(x.total)st.textContent='Loading '+MODEL.name+'… '+Math.round(x.loaded/x.total*100)+'%'},
    function(err){console.warn('Model not loaded, using procedural car',err);done(false)});
  }
  /* If positions arrive quantized (KHR_mesh_quantization), r128 reads raw integers on the CPU, so convert to float for raycasts, bounds and UVs. */
  function floatAttr(a){
    var arr=a.isInterleavedBufferAttribute?a.data.array:a.array;
    if(arr instanceof Float32Array&&!a.isInterleavedBufferAttribute)return a;
    var k=!a.normalized?1:arr instanceof Int8Array?127:arr instanceof Uint8Array?255:arr instanceof Int16Array?32767:arr instanceof Uint16Array?65535:1;
    var n=a.count,s=a.itemSize,o=new Float32Array(n*s),i;
    for(i=0;i<n;i++){o[i*s]=a.getX(i)/k;if(s>1)o[i*s+1]=a.getY(i)/k;if(s>2)o[i*s+2]=a.getZ(i)/k}
    if(a.normalized&&k>1&&(arr instanceof Int8Array||arr instanceof Int16Array))for(i=0;i<o.length;i++)if(o[i]<-1)o[i]=-1;
    return new THREE.BufferAttribute(o,s);
  }
  function zoneOf(name,mat){
    if(/ClothCouches/.test(mat)&&/puerta/i.test(name))return 'z2';
    if(/ClothCouches/.test(mat)&&/asiento|reposacabezas/i.test(name))return 'z1';
    if(mat==='RoofCloth')return 'z3';
    if(mat==='InteriorWood')return 'z4';
    if(/CueroVolante/.test(name))return 'z5';
    return null;
  }
  function fitModel(model){
    var drop=[];
    model.traverse(function(o){if(/SombraSketchfab|Xlay3d/.test(o.name))drop.push(o)});
    drop.forEach(function(o){o.parent.remove(o)});
    /* orient: longest horizontal axis becomes z, bonnet toward -z; centimetres to metres; centred on the ground */
    var pivot=new THREE.Group();pivot.add(model);scene.add(pivot);
    pivot.scale.setScalar(MODEL.scale);pivot.updateMatrixWorld(true);
    var geoDone=new Map();
    model.traverse(function(o){
      if(!o.isMesh)return;
      var g=o.geometry;
      if(!geoDone.has(g)){g.setAttribute('position',floatAttr(g.attributes.position));g.boundingBox=g.boundingSphere=null;g.computeBoundingSphere();geoDone.set(g,1)}
    });
    /* exact world bounds from the vertices (Box3.setFromObject over-sizes rotated meshes in r128) */
    var tv=new THREE.Vector3();
    function boxOf(re){
      var b=new THREE.Box3();model.updateMatrixWorld(true);
      model.traverse(function(o){if(o.isMesh&&re.test(o.name)){var p=o.geometry.attributes.position;for(var i=0;i<p.count;i++)b.expandByPoint(tv.fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld))}});
      return b;
    }
    var all=boxOf(/./),sz=all.getSize(new THREE.Vector3());
    var capo=boxOf(/Capo/).getCenter(new THREE.Vector3()),ctr=all.getCenter(new THREE.Vector3());
    if(sz.x>sz.z)pivot.rotation.y=capo.x>ctr.x?Math.PI/2:-Math.PI/2;
    else if(capo.z>ctr.z)pivot.rotation.y=Math.PI;
    pivot.updateMatrixWorld(true);
    all=boxOf(/./);ctr=all.getCenter(new THREE.Vector3());
    pivot.position.set(-ctr.x,-all.min.y,-ctr.z);pivot.updateMatrixWorld(true);
    all=boxOf(/./);sz=all.getSize(new THREE.Vector3());

    /* zones, per-mesh world data */
    var meshes=[],nm=new THREE.Matrix3(),v=new THREE.Vector3();
    model.traverse(function(o){if(o.isMesh)meshes.push(o)});
    var info=meshes.map(function(m){
      var g=m.geometry,pos=g.attributes.position,n=pos.count,W=new Float32Array(n*3),e=m.matrixWorld,b=new THREE.Box3(),i;
      for(i=0;i<n;i++){v.fromBufferAttribute(pos,i).applyMatrix4(e);W[i*3]=v.x;W[i*3+1]=v.y;W[i*3+2]=v.z;b.expandByPoint(v)}
      var name=(m.name+' '+(m.parent?m.parent.name:'')),mat=m.material.name||'';
      return {m:m,W:W,box:b,zone:zoneOf(name,mat),name:name};
    });
    function union(f){var b=new THREE.Box3();info.forEach(function(d){if(f(d))b.union(d.box)});return b}
    var wheel=union(function(d){return d.zone==='z5'}),roof=union(function(d){return d.zone==='z3'&&/TechoInterior/.test(d.name)});
    var seatF=union(function(d){return d.zone==='z1'&&!/Trasero/i.test(d.name)}),seatR=union(function(d){return d.zone==='z1'&&/Trasero/i.test(d.name)});
    var wood=union(function(d){return d.zone==='z4'}),side=wheel.getCenter(new THREE.Vector3()).x<0?-1:1;
    var doorF=union(function(d){return d.zone==='z2'&&/Delanter/i.test(d.name)&&Math.sign(d.box.getCenter(v).x)===side});
    var W0=wheel.getCenter(new THREE.Vector3()),SF=seatF.getCenter(new THREE.Vector3()),SR=seatR.getCenter(new THREE.Vector3());
    var cutX=Math.max(Math.abs(seatF.min.x),Math.abs(seatF.max.x))+.03,cutY=roof.min.y-.08,cutZ=seatR.max.z+.03;

    /* zone meshes get world-space box UVs; every material honours the cutaway planes */
    var block=[];
    for(var z in ZM)ZM[z].length=0;allZone.length=0;
    info.forEach(function(d){
      var m=d.m,W=d.W,n=W.length/3,i;
      m.material.clippingPlanes=CLIP;
      if(!d.zone){if(!m.material.transparent)block.push(m);return}
      var g=m.geometry=m.geometry.clone(),nor=g.attributes.normal,uv=new Float32Array(n*2);
      nm.getNormalMatrix(m.matrixWorld);
      for(i=0;i<n;i++){
        if(nor)v.set(nor.getX(i),nor.getY(i),nor.getZ(i)).applyMatrix3(nm);else v.set(0,1,0);
        var ax=Math.abs(v.x),ay=Math.abs(v.y),az=Math.abs(v.z);
        if(ax>=ay&&ax>=az){uv[i*2]=W[i*3+2];uv[i*2+1]=W[i*3+1]}
        else if(ay>=az){uv[i*2]=W[i*3];uv[i*2+1]=W[i*3+2]}
        else{uv[i*2]=W[i*3];uv[i*2+1]=W[i*3+1]}
      }
      g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
      m.userData.zone=d.zone;ZM[d.zone].push(m);allZone.push(m);
    });
    shellBlock.length=0;block.forEach(function(p){shellBlock.push(p)});

    /* paint: the white body panels take the paint swatch; the black roof and trims stay */
    bodyMats.length=0;
    model.traverse(function(o){if(o.isMesh&&o.material.name===MODEL.paint&&bodyMats.indexOf(o.material)<0)bodyMats.push(o.material)});
    bodyMats.forEach(function(m){m.color.set(PAINTS[state.paint].c).convertSRGBToLinear();m.metalness=.35;m.roughness=.3})

    /* contact shadow, procedural car off */
    var sc=document.createElement('canvas');sc.width=sc.height=128;var sg=sc.getContext('2d'),gr=sg.createRadialGradient(64,64,8,64,64,64);
    gr.addColorStop(0,'rgba(0,0,0,.8)');gr.addColorStop(.6,'rgba(0,0,0,.4)');gr.addColorStop(1,'rgba(0,0,0,0)');sg.fillStyle=gr;sg.fillRect(0,0,128,128);
    var sh=new THREE.Mesh(new THREE.PlaneGeometry(sz.x*1.35,sz.z*1.18),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,opacity:.75,depthWrite:false}));sh.rotation.x=-Math.PI/2;sh.position.y=.003;scene.add(sh);
    root.visible=false;gShell.visible=false;dome.castShadow=false;dome.position.set(0,cutY-.12,SF.z+.3);
    cut={x:Math.max(Math.abs(doorF.getCenter(v).x),cutX+.05),y:cutY,z:cutZ,top:sz.y,front:wood.min.z-.25,far:5};

    /* camera views from the model's own landmarks */
    var eyeY=W0.y+.36,cz=(SF.z+SR.z)/2;
    VIEWS.exterior={px:0,py:sz.y*.42,pz:0,yaw:-2.55,pitch:-.14,d:Math.max(sz.z,3.2)*2.05,fov:34};
    VIEWS.overview={px:0,py:SF.y,pz:cz,yaw:-1.05,pitch:-.5,d:3.5,fov:50};
    VIEWS.driver={px:W0.x,py:eyeY,pz:W0.z+.55,yaw:0,pitch:-.14,d:0,fov:78};
    VIEWS.rear={px:SR.x*0,py:eyeY-.02,pz:SR.z-.05,yaw:0,pitch:-.08,d:0,fov:82};
    ZVIEWS.z1={px:SF.x*.5,py:SF.y,pz:cz,yaw:-.9,pitch:-.38,d:2.6,fov:50};
    ZVIEWS.z2={px:-side*.15,py:doorF.getCenter(v).y+.12,pz:doorF.getCenter(v).z,yaw:side*Math.PI/2,pitch:-.18,d:0,fov:74};
    ZVIEWS.z3={px:0,py:eyeY-.05,pz:cz,yaw:0,pitch:.95,d:0,fov:84};
    /* seated in the passenger seat, looking at the wood trim */
    var wc=wood.getCenter(new THREE.Vector3()),pe=new THREE.Vector3(-side*.33,eyeY-.05,SF.z+.05),dv=wc.clone().sub(pe);
    ZVIEWS.z4={px:pe.x,py:pe.y,pz:pe.z,yaw:Math.atan2(dv.x,-dv.z),pitch:Math.atan2(dv.y,Math.hypot(dv.x,dv.z)),d:0,fov:62};
    ZVIEWS.z5={px:W0.x,py:W0.y+.26,pz:W0.z+.42,yaw:0,pitch:-.22,d:0,fov:56};

    ZONES.forEach(function(z){applySel(z.id)});
    $('.prod').textContent=MODEL.name+' · Interior';
    $('#credit').innerHTML='3D model: <a href="'+MODEL.src+'" target="_blank" rel="noopener">'+MODEL.title+'</a> by '+MODEL.author+', <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Optimised and re-materialled for this demo.';
    $('#credit').hidden=false;
    setGoal(state.view?VIEWS[state.view]:ZVIEWS[state.zone]);
    dirty=true;
  }
  loadModel();
}

/* ---------- Actions ---------- */
function selectZone(id){
  state.zone=id;state.view=null;
  renderAll();
  if(gl){gl.focus(ZVIEWS[id]);gl.pulse(id)}
}
function setView(v){state.view=v;renderViews();if(gl)gl.focus(VIEWS[v])}
function setPaint(i){state.paint=i;renderAll();if(gl)gl.paint(PAINTS[i].c)}
function pickMat(id){
  var m=matById(id);state.sel[m.zone]=id;renderAll();
  if(gl){gl.refresh(m.zone);gl.pulse(m.zone)}
}
function setStatus(s){
  var m=matById(state.sel[state.zone]);m.status=(m.status===s)?'pending':s;renderAll();
}
function applyPreset(i){
  var p=PRESETS[i];
  ZONES.forEach(function(z){state.sel[z.id]=p.sel[z.id];if(gl)gl.refresh(z.id)});
  state.view='overview';renderAll();if(gl)gl.focus(VIEWS.overview);
}

document.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.zone)selectZone(t.dataset.zone);
  else if(t.dataset.mat)pickMat(t.dataset.mat);
  else if(t.dataset.status)setStatus(t.dataset.status);
  else if(t.dataset.preset)applyPreset(+t.dataset.preset);
  else if(t.dataset.paint!==undefined)setPaint(+t.dataset.paint);
  else if(t.dataset.view)setView(t.dataset.view);
});

renderAll();
if(window.THREE){setTimeout(init3D,30)}
else{$('#loading').hidden=true;$('#nogl').hidden=false}
})();
</script>
